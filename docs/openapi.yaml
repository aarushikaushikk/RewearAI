                  name: Linen shirt
                  image:
                    url: https://res.cloudinary.com/example-cloud/image/upload/v1731577800/rewear/users/6650a1b2c3d4e5f6a7b8c9d0/k3x9q2.jpg
                  category: Top
                  color: White
                  style: Button-down
                  season: Summer
                  formality: Smart casual
                - status: missing
